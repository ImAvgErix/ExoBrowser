name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          config: .github/.markdownlint-cli2.yaml
          globs: |
            README.md
            CHANGELOG.md
            PRIVACY.md
            SECURITY.md
            THIRD_PARTY_NOTICES.md
            docs/HELP.md
            .github/**/*.md

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .github/lychee.toml --no-progress './README.md' './CHANGELOG.md' './PRIVACY.md' './SECURITY.md' './THIRD_PARTY_NOTICES.md' './docs/HELP.md' './.github/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
